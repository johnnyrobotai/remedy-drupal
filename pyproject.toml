[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remedy-drupal"
version = "0.1.0"
description = "Remedy Drupal accessibility remediation via Playwright browser automation"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
scanner = ["playwright>=1.40.0"]
llm = ["openai>=1.0.0"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
prod = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "playwright>=1.40.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "playwright>=1.40.0"]

[project.scripts]
remedy-drupal = "drupal_remedy.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
